<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Escala de Bem-Estar Financeiro</title><style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1c2430;--mut:#667085;--bd:#dde1e8;--ac:#1667b1;--acx:#e6f0fa;--wn:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1d232d;--tx:#e8ebf0;--mut:#9aa4b2;--bd:#323b49;--ac:#6db1f0;--acx:#22344a;--wn:#e0b04f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:1.35rem;margin:0}h2{font-size:1.05rem;margin:22px 0 8px;color:var(--ac)}
.sub,.note,.sm{color:var(--mut);font-size:.82rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.g5{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:4px}
label.f{display:block;font-size:.78rem;color:var(--mut)}
input,select,textarea{width:100%;padding:8px;margin-top:3px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto;margin-right:8px}
.ck{display:block;margin:4px 0;font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:.78rem}
td.v{font-weight:700;white-space:nowrap}
.w{color:var(--wn);font-size:.85rem;margin:4px 0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--bg);cursor:pointer;font-weight:600}
button.s{background:transparent;color:var(--ac)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;overflow-x:auto;white-space:nowrap;font-size:.82rem}
#bar b{color:var(--ac)}
#ta{display:none;height:200px}
@media print{#bar,.btns,#ta{display:none!important}}
</style></head><body><main><h1>Escala de Bem-Estar Financeiro</h1><p class="sub">Ferramenta independente. Nada é salvo nem enviado. O item 9 é invertido (6 − resposta) e as respostas originais ficam preservadas. O escore é provisório: não há pontos de corte definidos.</p><div id="app"></div><h2>Resultado</h2><div class="card" id="out"></div><div class="btns"><button id="copy">Copiar resumo</button><button class="s" id="exp">Copiar código para outra ferramenta</button><button class="s" id="print">Imprimir / PDF</button><button class="s" id="clr">Limpar</button></div><textarea id="ta" readonly></textarea></main><script>const $=s=>document.querySelector(s);
const fld=(k,l,t='text')=>`<label class="f">${l}<input data-k="${k}" data-l="${l}" type="${t}" ${t=='number'?'step="any" inputmode="decimal"':''}></label>`;
const sel=(k,l,o)=>`<label class="f">${l}<select data-k="${k}" data-l="${l}"><option value="">—</option>${o.map(v=>`<option>${v}</option>`).join('')}</select></label>`;
const ta=(k,l)=>`<label class="f">${l}<textarea data-k="${k}" data-l="${l}" rows="2"></textarea></label>`;
const ck=(k,l)=>`<label class="ck"><input type="checkbox" data-k="${k}" data-l="${l}">${l}</label>`;
const el=k=>document.querySelector(`[data-k="${k}"]`);
const v=k=>{const x=parseFloat(el(k).value);return isNaN(x)?null:x};
async function cp(t,b){const o=b.textContent;try{await navigator.clipboard.writeText(t);b.textContent='Copiado!';setTimeout(()=>b.textContent=o,1500)}catch(e){const a=$('#ta');a.value=t;a.style.display='block';a.select()}}
function imp(h){try{h(JSON.parse($('#imp').value.trim()));$('#impm').textContent='Importado.'}catch(e){$('#impm').textContent='Código inválido. Cole o código copiado de outra ferramenta.'}}
function dump(){const o={};document.querySelectorAll('[data-k]').forEach(e=>{const x=e.type=='checkbox'?(e.checked?'Sim':'Não'):e.value;if(x!=='')o[e.dataset.l||e.dataset.k]=x});return o}
const BE=["Consigo acompanhar minhas despesas e receitas com facilidade.", "Tenho controle sobre minha vida financeira do dia a dia.", "Consigo pagar todas as minhas contas em dia.", "Posso lidar com uma despesa inesperada sem precisar me endividar.", "Estou no caminho certo para alcançar meus objetivos financeiros.", "Tenho segurança de que terei recursos suficientes para viver bem no futuro.", "Sinto que posso tomar decisões financeiras que melhoram minha vida.", "Posso aproveitar a vida hoje, sem comprometer meu futuro financeiro.", "O dinheiro é uma fonte constante de estresse ou preocupação para mim.", "Me sinto confiante para tomar decisões financeiras importantes."];
$('#app').innerHTML=`<div class="card g">${fld('cod','Código interno do atendido')}${fld('data','Data da aplicação','date')}</div><div class="card"><div class="note" style="margin-bottom:8px">1 = discordo totalmente · 5 = concordo totalmente</div><div class="g">${BE.map((t,i)=>sel('be'+i,`${i+1}. ${t}${i==8?' (item invertido)':''}`,['1','2','3','4','5'])).join('')}</div></div>`;
let S=null;
function calc(){let n=0,t=0;const L=[];BE.forEach((_,i)=>{const x=v('be'+i);if(x!==null){n++;const a=i==8?6-x:x;t+=a;L.push([i+1,x,a])}});
 const sc=n==10?(t-10)/40*100:null;S={n,t,sc,L,txt:sc===null?null:sc.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'/100'};
 $('#out').innerHTML=`<div style="font-size:1.6rem;font-weight:700">${S.txt||'—'}</div><div class="sm">${n}/10 respondidas${n==10?` · soma ajustada ${t} (mín. 10, máx. 50) · BE = (${t} − 10) ÷ 40 × 100`:''}</div><table><tr><th>Item</th><th>Resposta original</th><th>Pontuação usada</th></tr>${L.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}${r[0]==9?' (6 − resposta)':''}</td></tr>`).join('')}</table>`}
$('#copy').onclick=()=>cp(['ESCALA DE BEM-ESTAR FINANCEIRO','Código: '+(el('cod').value||'-'),'Data da aplicação: '+(el('data').value||'-'),'Respostas originais (itens 1-10): '+BE.map((_,i)=>v('be'+i)??'-').join(', '),'Soma ajustada: '+(S.n==10?S.t:'incompleta'),'BE (provisório): '+(S.txt||'incompleto')].join('\n'),$('#copy'));
$('#exp').onclick=()=>cp(JSON.stringify({t:'BE',cod:el('cod').value,data:el('data').value,score:S.txt,soma:S.t,resp:BE.map((_,i)=>v('be'+i))}),$('#exp'));
$('#print').onclick=()=>window.print();
$('#clr').onclick=()=>{document.querySelectorAll('[data-k]').forEach(e=>e.type=='checkbox'?e.checked=false:e.value='');if(window.reset)reset();calc()};
document.addEventListener('input',calc);document.addEventListener('change',calc);calc();</script></body></html>
